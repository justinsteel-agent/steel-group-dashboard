<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Construction Explorer</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{--paper:#F7F4EE;--ink:#1B2233;--brass:#B08D57;--rule:#E3DED4;--muted:#6B7280;--white:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif}
  h1,h2,h3,.serif{font-family:Baskerville,"Iowan Old Style","Times New Roman",serif;font-weight:400;letter-spacing:.01em}
  .wrap{max-width:1280px;margin:0 auto;padding:0 16px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0;border-bottom:1px solid var(--rule)}
  .filters select,.filters button{background:var(--white);border:1px solid var(--rule);color:var(--ink);padding:8px 10px;border-radius:4px;font:inherit;font-size:13px}
  .filters button{cursor:pointer}
  .filters .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--rule);background:var(--white);padding:6px 10px;border-radius:999px;font-size:12px;cursor:pointer;user-select:none}
  .chip.on{border-color:var(--brass);background:var(--brass);color:#fff}
  .count{margin-left:auto;font-size:12px;color:var(--muted);align-self:center}
  .layout{display:grid;grid-template-columns:1fr 420px;gap:16px;padding:16px 0}
  #map{height:620px;border:1px solid var(--rule);border-radius:6px;background:#eee}
  .cards{display:flex;flex-direction:column;gap:12px;max-height:620px;overflow:auto;padding-right:4px}
  .card{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;transition:border-color .15s}
  .card.active{border-color:var(--brass);box-shadow:0 0 0 2px rgba(176,141,87,.25)}
  .card h3{margin:0 0 2px;font-size:20px}
  .hero{aspect-ratio:16/9;width:100%;border-radius:4px;background:var(--paper);border:1px solid var(--rule);margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin:8px 0}
  .facts b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass);padding:2px 7px;border-radius:3px;margin-right:4px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;text-align:center;text-decoration:none;padding:9px 10px;border-radius:4px;font-size:13px;border:1px solid var(--ink);color:var(--ink);background:var(--white)}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover{background:var(--brass);border-color:var(--brass)}
  .verified{font-size:11px;color:var(--muted);margin-top:8px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .maplibregl-popup-content{font:13px/1.4 "Helvetica Neue",Arial,sans-serif;color:var(--ink);padding:10px 12px}
  .pin{width:14px;height:14px;border-radius:50%;background:var(--brass);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer}
  .pin.active{background:var(--ink);transform:scale(1.3)}
  @media (max-width:900px){.layout{grid-template-columns:1fr}#map{height:380px}.cards{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="filters" id="filters">
    <select id="f-county"><option value="">All counties</option></select>
    <select id="f-price"><option value="">Any price</option></select>
    <select id="f-builder"><option value="">All builders</option></select>
    <select id="f-type"><option value="">All home types</option></select>
    <select id="f-timing"><option value="">Any move timing</option></select>
    <select id="f-district"><option value="">Any school district</option></select>
    <div class="chips" id="chips">
      <span class="chip" data-f="age_55_plus">55+</span><span class="chip" data-f="gated">Gated</span><span class="chip" data-f="pool">Pool</span><span class="chip" data-f="golf">Golf</span><span class="chip" data-f="waterfront">Waterfront</span>
    </div>
    <button id="reset" type="button">Reset</button><span class="count" id="count"></span>
  </div>
  <div class="layout">
    <div id="map"></div>
    <div class="cards" id="cards"></div>
  </div>
</div>
<script>
(async function(){
  const DATA_URL = (new URLSearchParams(location.search).get('data')) || 'communities.json';
  const fmt = n => n==null ? 'Awaiting data' : '$'+Number(n).toLocaleString();
  const txt = v => (v==null||v==='') ? 'Awaiting data' : v;
  const res = await fetch(DATA_URL+'?v='+Date.now()); const db = await res.json();
  const all = db.communities.filter(c=>c.status!=='closed');
  const PRICE_BANDS=[['0-300000','Under $300K'],['300000-400000','$300K–$400K'],['400000-500000','$400K–$500K'],['500000-750000','$500K–$750K'],['750000-99999999','$750K+']];
  const TIMING=[['now','Available now'],['0-90','0–90 days'],['3-6','3–6 months'],['plan','Build from a plan']];
  const TYPES=[['single-family','Single-family'],['townhome','Townhome'],['condo','Condo']];
  const inBand=(p,b)=>{const [lo,hi]=b.split('-').map(Number);return p!=null&&p>=lo&&p<hi};
  const uniq=a=>[...new Set(a.filter(Boolean))].sort();
  function fill(id,pairs,count){const sel=document.getElementById(id);const keep=sel.value;[...sel.options].slice(1).forEach(o=>o.remove());for(const [v,l] of pairs){const n=count(v);if(!n)continue;sel.insertAdjacentHTML('beforeend',`<option value="${v}">${l} (${n})</option>`)}sel.value=[...sel.options].some(o=>o.value===keep)?keep:''}
  function fillAll(){
    fill('f-county',uniq(all.map(c=>c.county)).map(x=>[x,x+' County']),v=>all.filter(c=>c.county===v).length);
    fill('f-price',PRICE_BANDS,v=>all.filter(c=>inBand(c.starting_price,v)).length);
    fill('f-builder',uniq(all.map(c=>c.builder)).map(x=>[x,x]),v=>all.filter(c=>c.builder===v).length);
    fill('f-type',TYPES,v=>all.filter(c=>(c.home_types||[]).includes(v)).length);
    fill('f-timing',TIMING,v=>all.filter(c=>(c.move_timing||[]).includes(v)).length);
    fill('f-district',uniq(all.map(c=>c.schools&&c.schools.district)).map(x=>[x,x]),v=>all.filter(c=>c.schools&&c.schools.district===v).length);
    document.querySelectorAll('.chip').forEach(ch=>{const f=ch.dataset.f;const n=all.filter(c=>c.features&&c.features[f]===true).length;ch.style.display=n?'':'none';ch.dataset.n=n});
  }
  fillAll();
  const map = new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[-79.05,33.6],zoom:9,attributionControl:true});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');
  let markers=[]; let activeId=null;
  const state={county:'',price:'',builder:'',type:'',timing:'',district:'',chips:new Set()};
  document.querySelectorAll('#filters select').forEach(s=>s.addEventListener('change',()=>{state[s.id.slice(2)]=s.value;render()}));
  document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{ch.classList.toggle('on');const f=ch.dataset.f;state.chips.has(f)?state.chips.delete(f):state.chips.add(f);render()}));
  // Unknown (null) never excludes a community; only a known mismatch does.
  function pass(c){
    if(state.county&&c.county&&c.county!==state.county)return false;
    if(state.builder&&c.builder!==state.builder)return false;
    if(state.type&&c.home_types&&c.home_types.length&&!c.home_types.includes(state.type))return false;
    if(state.timing&&c.move_timing&&c.move_timing.length&&!c.move_timing.includes(state.timing))return false;
    if(state.district&&c.schools&&c.schools.district&&c.schools.district!==state.district)return false;
    if(state.price&&c.starting_price!=null&&!inBand(c.starting_price,state.price))return false;
    for(const f of state.chips){const v=c.features&&c.features[f];if(v===false)return false}
    return true;
  }
  document.getElementById('reset').addEventListener('click',()=>{Object.assign(state,{county:'',price:'',builder:'',type:'',timing:'',district:''});state.chips.clear();document.querySelectorAll('#filters select').forEach(s=>s.value='');document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));render()});
  function card(c){
    const q=c.quick_move_ins||{};const fp=(c.floor_plans||[]).filter(p=>p.sqft);const stale=(c.stale?' · <span style="color:#b45309">verification pending</span>':'')+(c.geo_precision==='approximate'?' · pin approximate':'');
    const hero=c.media&&c.media.hero;
    return `<div class="card" id="card-${c.id}" data-id="${c.id}">
      <div class="hero">${hero?`<img src="${hero}" alt="${c.name} entrance" loading="lazy">`:'Entrance photo — on the next mission'}</div>
      <h3>${c.name}</h3>
      <div class="sub">${c.builder} · ${c.city}, ${c.county} County</div>
      ${(c.home_types||[]).map(t=>`<span class="badge">${t.replace('-',' ')}</span>`).join('')}${c.features&&c.features.age_55_plus?'<span class="badge">55+</span>':''}
      <div class="facts">
        <div><b>From</b>${fmt(c.starting_price)}</div>
        <div><b>Size</b>${c.sqft_min?`${c.sqft_min.toLocaleString()}–${(c.sqft_max||c.sqft_min).toLocaleString()} sq ft`:'Awaiting data'}</div>
        <div><b>Beds</b>${c.beds_min?`${c.beds_min}–${c.beds_max||c.beds_min}`:'Awaiting data'}</div>
        <div><b>Floor plans</b>${fp.length?fp.length+(c.floor_plans.length>fp.length?'+':''):'Awaiting data'}</div>
        <div><b>Ready now</b>${q.count==null?'Awaiting data':q.count+(q.price_min?` · ${fmt(q.price_min)}+`:'')}</div>
        <div><b>HOA</b>${c.hoa_monthly==null?'Awaiting data':'$'+c.hoa_monthly+'/mo'}</div>
        <div style="grid-column:1/-1"><b>Schools</b>${c.schools?`${txt(c.schools.elementary)} · ${txt(c.schools.middle)} · ${txt(c.schools.high)}`:'Awaiting data'}</div>
      </div>
      <div class="actions">
        ${c.guide_url?`<a class="btn" href="${c.guide_url}" target="_top">Community guide</a>`:`<span class="btn" style="opacity:.55;cursor:default">Guide coming soon</span>`}
        <a class="btn primary" href="${c.guide_url?c.guide_url+'#tour':'https://thesteel.group/new-construction/#tour'}" target="_top">Tour with representation</a>
      </div>
      <div class="verified">Last verified ${c.last_verified||'—'}${stale}</div>
    </div>`;
  }
  function render(){
    const list=all.filter(pass);
    document.getElementById('count').textContent=`${list.length} communit${list.length===1?'y':'ies'}`;
    const el=document.getElementById('cards');
    el.innerHTML=list.length?list.map(card).join(''):'<div class="empty">No community matches every filter you picked. Clear one, or hit Reset — every community we track is listed when no filters are set.</div>';
    markers.forEach(m=>m.remove());markers=[];
    const b=new maplibregl.LngLatBounds();
    list.forEach(c=>{if(c.lat==null)return;const d=document.createElement('div');d.className='pin';d.dataset.id=c.id;
      const m=new maplibregl.Marker({element:d}).setLngLat([c.lng,c.lat]).setPopup(new maplibregl.Popup({offset:12,closeButton:false}).setHTML(`<strong>${c.name}</strong><br>${c.builder}<br>From ${fmt(c.starting_price)}`)).addTo(map);
      d.addEventListener('click',()=>focus(c.id));markers.push(m);b.extend([c.lng,c.lat])});
    if(list.length>1)map.fitBounds(b,{padding:60,maxZoom:12});else if(list.length===1)map.flyTo({center:[list[0].lng,list[0].lat],zoom:12});
    el.querySelectorAll('.card').forEach(k=>k.addEventListener('mouseenter',()=>focus(k.dataset.id,false)));
  }
  function focus(id,scroll=true){activeId=id;document.querySelectorAll('.card').forEach(k=>k.classList.toggle('active',k.dataset.id===id));document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('active',p.dataset.id===id));
    if(scroll){const k=document.getElementById('card-'+id);k&&k.scrollIntoView({behavior:'smooth',block:'nearest'})}}
  render();
  map.on('error',e=>console.warn('map error',e&&e.error&&e.error.message));
  // let the parent page size the iframe
  const post=()=>{try{parent.postMessage({ncExplorerHeight:document.body.scrollHeight},'*')}catch(e){}};
  new ResizeObserver(post).observe(document.body);
})();
</script>
</body>
</html>
