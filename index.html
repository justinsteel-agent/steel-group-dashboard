<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Steel Group — Live Pipeline (Tier 1)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg: #FAF8F4;
    --ink: #241F1A;
    --ink-dim: #6B655C;
    --line: #E4DFD5;
    --card: #FFFFFF;
    --amber: #B4863E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg); color: var(--ink); font-family:'Inter', sans-serif;
    padding: 40px 40px 60px; min-width: 980px;
  }
  .wrap{ max-width: 1120px; margin: 0 auto; }

  header{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; color:#9A7B4F; text-transform:uppercase; margin-bottom:8px; font-weight:600; }
  h1{ font-size:26px; font-weight:800; letter-spacing:-0.01em; }

  .status-bar{
    display:flex; align-items:center; gap:14px; margin-bottom:28px;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px;
  }
  .status-dot{ width:9px; height:9px; border-radius:50%; background:#ccc; flex-shrink:0; }
  .status-dot.ok{ background:#4B8A5E; }
  .status-dot.err{ background:#C24B3F; }
  .status-text{ font-size:12.5px; color:var(--ink-dim); flex:1; }
  .status-text b{ color:var(--ink); }
  .refresh-btn{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:700;
    background:#3A6EA5; color:#fff; border:none; border-radius:7px; padding:8px 14px;
    cursor:pointer; flex-shrink:0;
  }
  .refresh-btn:hover{ opacity:.9; }
  .refresh-btn:disabled{ opacity:.5; cursor:default; }

  .setup-box{
    background:#FFF9EE; border:1px solid #E9DFC4; border-left:3px solid var(--amber);
    border-radius:0 8px 8px 0; padding:16px 20px; margin-bottom:28px; font-size:12.5px;
    color:#5C4A28; line-height:1.6;
  }
  .setup-box code{
    font-family:'JetBrains Mono', monospace; background:#fff; border:1px solid #E9DFC4;
    border-radius:4px; padding:1px 5px; font-size:11.5px;
  }
  .setup-box input{
    width:100%; font-family:'JetBrains Mono', monospace; font-size:12px; padding:7px 10px;
    border:1px solid #E9DFC4; border-radius:6px; margin-top:8px; background:#fff;
  }

  .section-title{ font-size:16px; font-weight:700; margin: 34px 0 14px; }
  .section-sub{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim); font-weight:400; margin-left:8px; }

  /* --- Funnel layout, matches the static reference funnels --- */
  .grid{ display:grid; grid-template-columns: 480px 1fr; gap: 20px; align-items:center; }
  .funnel-svg-wrap{ position:relative; }

  .stage-block{
    box-sizing: border-box; display: flex; align-items: flex-start; gap: 16px;
    padding: 16px 0; position: relative;
  }
  .stage-block:not(:last-child)::after{
    content:""; position:absolute; left:20px; bottom:0; width:1px; height:16px; background: var(--line);
  }
  .letter{
    flex-shrink:0; width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:15px; font-family:'JetBrains Mono', monospace;
  }
  .stage-body{ flex:1; padding-top:2px; }
  .stage-title-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .stage-title{ font-size:15px; font-weight:700; }
  .value-row{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .value-big{ font-family:'JetBrains Mono', monospace; font-size:19px; font-weight:800; }
  .value-count{ font-size:11px; color:var(--ink-dim); }
  .gci-row{ display:flex; align-items:baseline; gap:8px; }
  .gci-label{
    font-family:'JetBrains Mono', monospace; font-size:9px; font-weight:700;
    letter-spacing:.06em; color:var(--ink-dim); text-transform:uppercase;
    background:#F1EEE6; border-radius:4px; padding:1px 6px;
  }
  .gci-val{ font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; }
  .gci-warn{
    font-size:10px; color:var(--amber); background:#FFF3DA; border:1px solid #E9DFC4;
    border-radius:4px; padding:1px 6px; font-weight:600;
  }
  .rollup-list{ font-size:11px; color:var(--ink-dim); margin-top:6px; line-height:1.5; }
  .empty-state{ text-align:center; padding:30px 20px; color:var(--ink-dim); font-size:12.5px; }

  /* --- Sold Properties Map --- */
  .sold-map-layout{ display:flex; gap:16px; align-items:stretch; }
  #sold-map{ flex:1; min-height:420px; border:1px solid var(--line); border-radius:10px; background:#EFEAE0; }
  .sold-sidebar{ width:280px; flex-shrink:0; max-height:420px; overflow-y:auto; }
  .sold-prop-card{
    background:#fff; border:1px solid var(--line); border-left-width:3px; border-radius:6px;
    padding:9px 12px; margin-bottom:8px; cursor:pointer; font-size:12px;
  }
  .sold-prop-card:hover, .sold-prop-card.active{ border-color:#3A6EA5; border-left-color:#3A6EA5; }
  .sold-prop-card .addr{ font-weight:600; margin-bottom:3px; }
  .sold-prop-card .meta{ display:flex; justify-content:space-between; color:var(--ink-dim); font-family:'JetBrains Mono', monospace; font-size:10.5px; }
  .sold-key-bar{
    margin-top:14px; display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-dim);
  }
  .sold-key-bar .swatch{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
  .sold-key-bar b{ color:var(--ink); font-size:13px; }
  .sold-info-window .addr{ font-family:'Inter',sans-serif; font-weight:700; font-size:13px; margin-bottom:3px; }
  .sold-info-window .row{ font-size:11.5px; color:#6B655C; display:flex; justify-content:space-between; gap:12px; font-family:'JetBrains Mono', monospace; }

  .alltime-box{
    margin-top:16px; display:inline-flex; align-items:center; gap:16px;
    background:#fff; border:1px dashed #3A6EA5; border-radius:10px; padding:14px 20px;
  }
  .alltime-box .lbl{
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:#3A6EA5;
  }
  .alltime-box .big{ font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:800; color:#3A6EA5; }
  .alltime-box .sub{ font-size:11px; color:var(--ink-dim); }
  .estimate-tag{ font-size:10.5px; color:var(--ink-dim); font-family:'JetBrains Mono', monospace; margin-left:6px; }

  .missing-table{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; max-width: 820px; }
  .missing-row{ display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .missing-row:last-child{ border-bottom:none; }
  .missing-row:nth-child(even){ background:#FBFAF7; }
  .missing-name{ flex:1; font-weight:600; }
  .missing-flags{ display:flex; gap:5px; flex-shrink:0; }
  .miss-badge{
    font-family:'JetBrains Mono', monospace; font-size:9px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; color:var(--amber);
    background:#FFF3DA; border:1px solid #E9DFC4; border-radius:4px; padding:2px 6px;
  }
  .fix-link{
    flex-shrink:0; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    text-decoration:none; color:#3A6EA5; border:1px solid var(--line); border-radius:6px;
    padding:4px 9px; transition:border-color .12s;
  }
  .fix-link:hover{ border-color: currentColor; }

  footer{ margin-top:36px; padding-top:16px; border-top:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-dim); display:flex; justify-content:space-between; }

  .header-nav{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    font-family:'JetBrains Mono', monospace; font-size:11.5px;
  }
  .header-nav a{
    color:#3A6EA5; text-decoration:none; font-weight:700; padding:6px 12px;
    border:1px solid var(--line); border-radius:7px; background:#fff; transition:border-color .12s;
  }
  .header-nav a:hover{ border-color:#3A6EA5; }
</style>
</head>
<body>
<div class="wrap">

  <header style="flex-direction:column; align-items:flex-start; gap:16px;">
    <img id="site-logo" src="logo.png" alt="The Steel Group" style="height:90px; width:auto; object-fit:contain;" onerror="this.style.display='none'">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; width:100%; flex-wrap:wrap; gap:14px;">
      <div>
        <div class="eyebrow">The Steel Group</div>
        <h1>Live Pipeline Dashboard</h1>
      </div>
      <nav class="header-nav">
        <a href="#anchor-lead">Lead Funnel</a>
        <a href="#anchor-contract">Contract Funnel</a>
        <a href="#anchor-sold">Sold Properties Map</a>
        <a href="#anchor-missing">Missing Info</a>
      </nav>
    </div>
  </header>

  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-text" id="status-text"></div>
    <button class="refresh-btn" id="refresh-btn">Refresh now</button>
  </div>

  <div class="section-title" id="anchor-lead">Lead Funnel <span class="section-sub">people, by stage</span></div>
  <div class="grid">
    <div id="people-stages"></div>
    <div class="funnel-svg-wrap" id="people-funnel"></div>
  </div>
  <div id="lead-stats-box"></div>

  <div class="section-title" id="anchor-contract">Contract Funnel <span class="section-sub">contracts, by stage — value &amp; GCI</span></div>
  <div class="grid">
    <div id="contract-stages"></div>
    <div class="funnel-svg-wrap" id="contract-funnel"></div>
  </div>
  <div id="alltime-closed-box"></div>

  <div class="section-title" id="anchor-sold">Sold Properties Map <span class="section-sub" id="sold-count-sub"></span></div>
  <div class="sold-map-layout">
    <div id="sold-map"></div>
    <div class="sold-sidebar">
      <div id="sold-prop-list"></div>
    </div>
  </div>
  <div class="sold-key-bar" id="sold-key-bar"></div>

  <div class="section-title" id="anchor-missing">Missing Data <span class="section-sub" id="missing-count-sub"></span></div>
  <div id="missing-data-table"></div>

  <footer>
    <span>THE STEEL GROUP · SureSend CRM</span>
    <span id="pull-time"></span>
  </footer>
</div>

<script>
const STORAGE_KEY = 'suresend_csv_url';
const RAW_STORAGE_KEY = 'suresend_raw_contracts_csv_url';

// Baked in as defaults — these are already public "anyone with the link" URLs
// (that's what Publish to web means), so hardcoding them here adds no new exposure
// beyond what already exists. localStorage still overrides these if you ever
// change which sheet you're pointing at.
const DEFAULT_STAGE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5p3_GYBrPG_-skbMKvJA2MLYWvokTjWMI4P_gDrCbzsp3QTmSezrLoo2uFP9GraJdJ2XBF7oO9-J2/pub?gid=1715969638&single=true&output=csv";
const DEFAULT_RAW_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5p3_GYBrPG_-skbMKvJA2MLYWvokTjWMI4P_gDrCbzsp3QTmSezrLoo2uFP9GraJdJ2XBF7oO9-J2/pub?gid=2028906285&single=true&output=csv";

// Sold Properties Map — fill these in once you have them (Sold_Properties tab
// published as CSV, and your Google Maps API key). Same pattern as above:
// hardcoded here, no separate setup box.
const SOLD_PROPERTIES_CSV_URL = "PASTE_YOUR_SOLD_PROPERTIES_CSV_URL_HERE";
const GOOGLE_MAPS_API_KEY = "AIzaSyDFyvVyYeu0ygOBcsGUoKBsfVAlYat9cTI";
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const pullTimeEl = document.getElementById('pull-time');
const refreshBtn = document.getElementById('refresh-btn');

const fmtMoney = n => (n === '' || n === null || n === undefined || isNaN(n)) ? '$0' : '$' + Math.round(n).toLocaleString('en-US');
const fmtInt = n => (n === '' || n === null || n === undefined || isNaN(n)) ? 0 : parseInt(n);

// Color palette cycled across however many stages actually show up — order isn't
// guaranteed meaningful (comes from Stage_Summary row order), so this is stylistic,
// not a claim about pipeline sequence.
const PALETTE = ["#C24B3F", "#D98A2B", "#C9A227", "#4B8A5E", "#3A6EA5", "#6B5B95", "#B4863E", "#8A6FA8"];
let avgRateGlobal = 0;
let estimatedStageNamesGlobal = new Set();

// Best-effort canonical ordering for readability — stages not in this list keep
// whatever order the CSV returned them in, appended after known ones.
const PEOPLE_ORDER = ["New Lead","Called","Contacted","Qualifying","Appointment Set","Appointment Met","Active Client"];
const CONTRACT_ORDER = ["Seller Consultation Scheduled","Listing Agreement Signed","Launch","Listing Won","Active","Pending","Under Contract","First Open House","Clear to Close","Appraisal Complete","Transaction Closed","Closed (YTD)"];

// Manually-defined merges: combine multiple raw stage names into one displayed
// stage, with a breakdown of the original names/counts kept visible underneath.
// "Listed on MLS" (seller-side) and "Property Search" (buyer-side) both represent
// an actively-working deal, just from opposite sides of the transaction.
const MERGE_GROUPS = {
  contract: [
    { label: "Active", members: ["Listed on MLS", "Property Search"] }
  ],
  person: []
};

function applyMergeGroups(rows, key, groups){
  let result = [...rows];
  groups.forEach(group => {
    const matches = result.filter(r => group.members.includes(r[key]));
    if (!matches.length) return;
    result = result.filter(r => !group.members.includes(r[key]));

    const merged = { [key]: group.label, entity: matches[0].entity };
    ['count','value','gci','missing_value','missing_commission'].forEach(field => {
      merged[field] = matches.reduce((acc, r) => acc + (fmtInt(r[field]) ? parseFloat(r[field]) : 0), 0);
    });
    merged.breakdown = matches.map(r => ({ name: r[key], count: fmtInt(r.count) }));
    result.push(merged);
  });
  return result;
}

function filterAndSort(rows, orderList, key){
  const known = rows.filter(r => orderList.includes(r[key]));
  known.sort((a,b) => orderList.indexOf(a[key]) - orderList.indexOf(b[key]));
  return known;
}

function getStoredUrl(){ return localStorage.getItem(STORAGE_KEY) || DEFAULT_STAGE_URL; }
function setStoredUrl(url){ localStorage.setItem(STORAGE_KEY, url); }
function getStoredRawUrl(){ return localStorage.getItem(RAW_STORAGE_KEY) || DEFAULT_RAW_URL; }
function setStoredRawUrl(url){ localStorage.setItem(RAW_STORAGE_KEY, url); }

function setStatus(state, text){
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.innerHTML = text;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));
}

async function loadData(){
  const url = getStoredUrl();
  if(!url){
    setStatus('', 'Not connected yet — paste your published CSV URL above.');
    renderPeopleFunnel([]);
    renderContractFunnel([]);
    renderAllTimeClosed(null, 0);
    renderLeadStats(0, 0, 0);
    return;
  }

  setStatus('', 'Fetching…');
  refreshBtn.disabled = true;

  try {
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const table = parseCSV(text);
    if(!table.length) throw new Error('CSV came back empty');

    const headers = table[0];
    const dataRows = table.slice(1).map(r => {
      const obj = {}; headers.forEach((h, i) => obj[h] = r[i]); return obj;
    });

    let people = dataRows.filter(s => s.entity === 'person');
    let contracts = dataRows.filter(s => s.entity === 'contract');

    // Total Leads = every person record, full stop — computed before any stage
    // filtering, so it reflects your real headcount, not just the trimmed
    // pipeline subset shown in the funnel below.
    const totalLeadsAll = people.reduce((acc, r) => acc + fmtInt(r.count), 0);

    // Nurture and Mets sit outside the lettered pipeline — pulled out before filtering.
    const nurtureRow = people.find(r => r.stage === 'Nurture') || null;
    const metsRow = dataRows.find(r => r.entity === 'metric' && r.stage === 'Mets') || null;
    people = people.filter(r => r.stage !== 'Nurture');

    // Pull the all-time "Closed" row out before it enters the pipeline — it's shown
    // separately, and also feeds the dynamic average-rate estimate for early stages.
    const allTimeClosed = contracts.find(r => r.stage === 'Closed') || null;
    contracts = contracts.filter(r => r.stage !== 'Closed');

    people = applyMergeGroups(people, 'stage', MERGE_GROUPS.person);
    contracts = applyMergeGroups(contracts, 'stage', MERGE_GROUPS.contract);
    people = filterAndSort(people, PEOPLE_ORDER, 'stage');
    contracts = filterAndSort(contracts, CONTRACT_ORDER, 'stage');

    // Average rate now sourced from Closed (YTD), not all-time — more representative
    // of current commission structures than the full multi-year history.
    let avgRate = 0;
    const closedYtdRow = contracts.find(r => r.stage === 'Closed (YTD)');
    if (closedYtdRow) {
      const v = parseFloat(closedYtdRow.value), g = parseFloat(closedYtdRow.gci);
      if (v > 0 && !isNaN(g)) avgRate = g / v;
    }
    avgRateGlobal = avgRate;

    // Apply the dynamic estimate to the earliest pipeline stages (A, B, C) only when
    // they have no real commission entered yet — by CRM design, commission isn't
    // entered until later stages, so this fills the gap with a computed rate rather
    // than showing $0. Track which stage names got the estimate so the Missing Data
    // list below can skip flagging contracts in those stages as missing commission —
    // that's expected there, not a real gap.
    estimatedStageNamesGlobal = new Set();
    contracts.forEach((s, i) => {
      const realGci = fmtInt(s.gci) ? parseFloat(s.gci) : 0;
      if (i < 3 && s.stage !== 'Closed (YTD)' && realGci === 0 && avgRate > 0) {
        const val = fmtInt(s.value) ? parseFloat(s.value) : 0;
        s.gci = Math.round(val * avgRate * 100) / 100;
        s.estimated = true;
        estimatedStageNamesGlobal.add(s.stage);
      }
    });

    renderPeopleFunnel(people);
    renderContractFunnel(contracts);
    renderAllTimeClosed(allTimeClosed, avgRate);
    await loadMissingData();

    const totalLeads = totalLeadsAll;
    renderLeadStats(totalLeads, metsRow ? fmtInt(metsRow.count) : 0, nurtureRow ? fmtInt(nurtureRow.count) : 0);

    setStatus('ok', '');
  } catch (err) {
    setStatus('err', '');
    renderPeopleFunnel([]);
    renderContractFunnel([]);
    renderAllTimeClosed(null, 0);
    renderLeadStats(0, 0, 0);
  } finally {
    refreshBtn.disabled = false;
  }
}

// --- Shared funnel builder: renders lettered stage list + tapered SVG ---
function buildFunnel(stages, { listElId, svgElId, hasMoney }){
  const listEl = document.getElementById(listElId);
  const svgWrapEl = document.getElementById(svgElId);
  listEl.innerHTML = '';
  svgWrapEl.innerHTML = '';

  if (!stages.length) {
    listEl.innerHTML = `<div class="empty-state">No data yet — connect a CSV URL above.</div>`;
    return;
  }

  const letters = "ABCDEFGHIJKLMNOP";
  const colored = stages.map((s, i) => ({ ...s, letter: letters[i] || '?', color: PALETTE[i % PALETTE.length] }));

  // --- Left column: lettered stage list ---
  colored.forEach(s=>{
    const block = document.createElement('div');
    block.className = 'stage-block';
    const count = fmtInt(s.count);
    const rollupList = s.otherNames ? `<div class="rollup-list">${s.otherNames.join(', ')}</div>` : '';
    const breakdownList = s.breakdown ? `<div class="rollup-list">${s.breakdown.map(b => `${b.name}: ${b.count}`).join(' · ')}</div>` : '';
    if (hasMoney) {
      const value = fmtInt(s.value) ? parseFloat(s.value) : 0;
      const gci = fmtInt(s.gci) ? parseFloat(s.gci) : 0;
      const missingV = fmtInt(s.missing_value);
      const missingC = fmtInt(s.missing_commission);
      block.innerHTML = `
        <div class="letter" style="background:${s.color}">${s.letter}</div>
        <div class="stage-body">
          <div class="stage-title-row"><span class="stage-title">${s.stage}</span></div>
          <div class="value-row">
            <span class="value-big" style="color:${s.color}">${fmtMoney(value)}</span>
            <span class="value-count">${count} contract${count===1?'':'s'}${missingV>0 ? ` · ${missingV} missing value` : ''}</span>
          </div>
          <div class="gci-row">
            <span class="gci-label">${s.estimated ? 'GCI est.' : 'GCI'}</span>
            <span class="gci-val" style="color:${s.color}">${fmtMoney(gci)}</span>
            ${s.estimated ? `<span class="estimate-tag">at ${(avgRateGlobal*100).toFixed(2)}% avg closed rate</span>` : ''}
            ${(!s.estimated && missingC>0) ? `<span class="gci-warn">${missingC} missing commission</span>` : ''}
          </div>
          ${rollupList}${breakdownList}
        </div>
      `;
    } else {
      block.innerHTML = `
        <div class="letter" style="background:${s.color}">${s.letter}</div>
        <div class="stage-body">
          <div class="stage-title-row"><span class="stage-title">${s.stage}</span></div>
          <div class="value-row"><span class="value-big" style="color:${s.color}">${count}</span><span class="value-count">contact${count===1?'':'s'}</span></div>
          ${rollupList}${breakdownList}
        </div>
      `;
    }
    listEl.appendChild(block);
  });

  // --- Right column: tapered SVG funnel, widths ∝ count ---
  const maxCount = Math.max(...colored.map(s => fmtInt(s.count)), 1);
  const minW = 70, maxW = 320;
  const widths = colored.map(s => {
    const c = fmtInt(s.count);
    return c > 0 ? minW + (maxW - minW) * (c / maxCount) : minW * 0.4;
  });

  const svgW = 460, segH = 68, depth = 22;
  const cx = svgW/2 - depth/2;
  let parts = [], y = 10;

  colored.forEach((s, i) => {
    const wTop = widths[i];
    const wBot = i < colored.length - 1 ? widths[i+1] : widths[i] * 0.55;
    const xTopL = cx - wTop/2, xTopR = cx + wTop/2;
    const xBotL = cx - wBot/2, xBotR = cx + wBot/2;
    const yTop = y, yBot = y + segH;

    parts.push(`<polygon points="${xTopL},${yTop} ${xTopR},${yTop} ${xBotR},${yBot} ${xBotL},${yBot}" fill="${s.color}" opacity="0.92" />`);
    parts.push(`<polygon points="${xTopR},${yTop} ${xTopR+depth},${yTop+depth*0.4} ${xBotR+depth},${yBot+depth*0.4} ${xBotR},${yBot}" fill="${s.color}" opacity="0.55" />`);
    const label = hasMoney ? fmtMoney(fmtInt(s.value) ? parseFloat(s.value) : 0) : fmtInt(s.count);
    parts.push(`<text x="${cx}" y="${(yTop+yBot)/2+5}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#fff">${label}</text>`);

    y = yBot;
  });

  const svgH = y + 20;
  svgWrapEl.innerHTML = `<svg viewBox="0 0 ${svgW} ${svgH}" width="100%" style="display:block; overflow:visible;">${parts.join('')}</svg>`;
}

async function loadMissingData(){
  const tableEl = document.getElementById('missing-data-table');
  const subEl = document.getElementById('missing-count-sub');
  const url = getStoredRawUrl();

  if (!url) {
    subEl.textContent = 'paste a Raw_Contracts CSV URL above to see this';
    tableEl.innerHTML = `<div class="empty-state">Not connected — publish Raw_Contracts and paste its CSV URL above.</div>`;
    return;
  }

  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const table = parseCSV(text);
    if (!table.length) throw new Error('CSV came back empty');

    const headers = table[0];
    const rows = table.slice(1).map(r => {
      const obj = {}; headers.forEach((h, i) => obj[h] = r[i]); return obj;
    });

    const missing = rows
      .map(r => {
        const flags = [];
        const stage = r.primaryPipelineStageName || '';
        const valEmpty = r.contractValue === '' || r.contractValue === undefined;
        const gciEmpty = r.totalCommission === '' || r.totalCommission === undefined;
        const isEstimatedStage = estimatedStageNamesGlobal.has(stage);
        if (valEmpty) flags.push('value');
        // Missing commission isn't a real gap in stages currently using the dynamic
        // estimate — that's expected there by CRM design, not something to fix.
        if (gciEmpty && !isEstimatedStage) flags.push('commission');
        return { id: r.id, name: r.name || '(unnamed)', stage, flags };
      })
      .filter(r => r.flags.length > 0 && r.id);

    subEl.textContent = `${missing.length} contract${missing.length===1?'':'s'} · value or commission not entered`;

    if (!missing.length) {
      tableEl.innerHTML = `<div class="empty-state">Nothing missing — every contract has value and commission entered.</div>`;
      return;
    }

    const table_ = document.createElement('div');
    table_.className = 'missing-table';
    missing.forEach(m => {
      const row = document.createElement('div');
      row.className = 'missing-row';
      const badges = m.flags.map(f => `<span class="miss-badge">${f}</span>`).join('');
      row.innerHTML = `
        <span class="missing-name">${m.name}${m.stage ? ` <span style="color:var(--ink-dim); font-weight:400;">— ${m.stage}</span>` : ''}</span>
        <span class="missing-flags">${badges}</span>
        <a class="fix-link" target="_blank" rel="noopener" href="https://suresend.ai/contracts/${m.id}">Fix ↗</a>
      `;
      table_.appendChild(row);
    });
    tableEl.innerHTML = '';
    tableEl.appendChild(table_);
  } catch (err) {
    subEl.textContent = '';
    tableEl.innerHTML = `<div class="empty-state">Fetch failed: ${err.message}. Confirm you published <b>Raw_Contracts</b> specifically as CSV.</div>`;
  }
}

// ============================================================
// SOLD PROPERTIES MAP
// ============================================================
const BUYER_COLOR = "#3E6FD9";
const SELLER_COLOR = "#D6483F";
const OTHER_COLOR = "#9AA1B4";

let soldMap = null;
let soldMarkers = [];
let soldInfoWindow = null;
let soldMapsScriptRequested = false;

function classifySide(contractType){
  const t = String(contractType || '').toLowerCase();
  if (t.indexOf('buyer') !== -1) return 'buyer';
  if (t.indexOf('listing') !== -1) return 'seller';
  return 'other';
}
function sideColor(side){
  if (side === 'buyer') return BUYER_COLOR;
  if (side === 'seller') return SELLER_COLOR;
  return OTHER_COLOR;
}
function sideLabel(side){
  if (side === 'buyer') return 'Buyer side';
  if (side === 'seller') return 'Seller side';
  return 'Other';
}
function fmtSoldDate(v){
  if(!v) return '—';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function makeSoldPin(color){
  return {
    path: "M12 0C7 0 3 4 3 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z",
    fillColor: color, fillOpacity: 1, strokeColor: "#ffffff", strokeWeight: 1.5,
    scale: 1.3, anchor: new google.maps.Point(12, 24),
  };
}

function initSoldMapSetup(){
  const el = document.getElementById('sold-map');
  const subEl = document.getElementById('sold-count-sub');

  if (SOLD_PROPERTIES_CSV_URL.indexOf('PASTE_YOUR') === 0 || GOOGLE_MAPS_API_KEY.indexOf('PASTE_YOUR') === 0){
    el.innerHTML = `<div class="empty-state" style="padding-top:170px;">Set <code>SOLD_PROPERTIES_CSV_URL</code> and <code>GOOGLE_MAPS_API_KEY</code> near the top of the script to enable this map.</div>`;
    return;
  }
  if (soldMapsScriptRequested) return;
  soldMapsScriptRequested = true;

  window.initSoldMap = function(){
    soldMap = new google.maps.Map(el, {
      center: { lat: 33.45, lng: -79.15 },
      zoom: 10,
      mapTypeControl: false,
      streetViewControl: false,
      styles: [
        { elementType: "geometry", stylers: [{ color: "#efeae0" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#6B655C" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#c9d6e3" }] },
        { featureType: "road", elementType: "geometry", stylers: [{ color: "#ffffff" }] },
        { featureType: "poi", stylers: [{ visibility: "off" }] },
      ],
    });
    soldInfoWindow = new google.maps.InfoWindow();
    loadSoldProperties();
  };

  const script = document.createElement('script');
  script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=initSoldMap&loading=async`;
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}

async function loadSoldProperties(){
  const listEl = document.getElementById('sold-prop-list');
  const keyBarEl = document.getElementById('sold-key-bar');
  const subEl = document.getElementById('sold-count-sub');

  soldMarkers.forEach(m => m.setMap(null));
  soldMarkers = [];

  try {
    const res = await fetch(SOLD_PROPERTIES_CSV_URL + (SOLD_PROPERTIES_CSV_URL.indexOf('?')>-1?'&':'?') + 'cachebust=' + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2){ listEl.innerHTML = `<div class="empty-state">No sold properties yet.</div>`; return; }
    const headers = rows[0].map(h => h.trim());
    const idx = {
      address: headers.indexOf('Address'), lat: headers.indexOf('Lat'), lng: headers.indexOf('Lng'),
      closedDate: headers.indexOf('ClosedDate'), value: headers.indexOf('ContractValue'), contractType: headers.indexOf('ContractType'),
    };
    const props = rows.slice(1)
      .filter(r => r[idx.lat] && r[idx.lng])
      .map(r => ({
        address: r[idx.address], lat: parseFloat(r[idx.lat]), lng: parseFloat(r[idx.lng]),
        closedDate: r[idx.closedDate], value: r[idx.value],
        side: classifySide(idx.contractType !== -1 ? r[idx.contractType] : ''),
      }))
      .filter(p => !isNaN(p.lat) && !isNaN(p.lng));

    if (!props.length){
      listEl.innerHTML = `<div class="empty-state">No geocoded properties yet.</div>`;
      subEl.textContent = '';
      keyBarEl.innerHTML = '';
      return;
    }

    listEl.innerHTML = '';
    const bounds = new google.maps.LatLngBounds();
    let buyerCount = 0, sellerCount = 0, otherCount = 0, totalVolume = 0;

    props.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'sold-prop-card';
      card.id = 'sold-card-' + i;
      card.style.borderLeftColor = sideColor(p.side);
      card.innerHTML = `<div class="addr">${p.address}</div><div class="meta"><span>${fmtSoldDate(p.closedDate)}</span><span>${fmtMoney(p.value)}</span></div>`;
      card.addEventListener('click', () => focusSoldMarker(i));
      listEl.appendChild(card);

      const marker = new google.maps.Marker({ position: { lat: p.lat, lng: p.lng }, map: soldMap, icon: makeSoldPin(sideColor(p.side)), title: p.address });
      marker.addListener('click', () => {
        soldInfoWindow.setContent(`<div class="sold-info-window"><div class="addr">${p.address}</div><div class="row"><span>Closed</span><b>${fmtSoldDate(p.closedDate)}</b></div><div class="row"><span>Sale price</span><b>${fmtMoney(p.value)}</b></div></div>`);
        soldInfoWindow.open(soldMap, marker);
        document.querySelectorAll('.sold-prop-card').forEach(c => c.classList.remove('active'));
        const c = document.getElementById('sold-card-' + i);
        if (c){ c.classList.add('active'); c.scrollIntoView({behavior:'smooth', block:'nearest'}); }
      });
      soldMarkers.push(marker);
      bounds.extend(marker.getPosition());

      if (p.side === 'buyer') buyerCount++; else if (p.side === 'seller') sellerCount++; else otherCount++;
      const v = parseFloat(String(p.value).replace(/[^0-9.-]/g,''));
      if (!isNaN(v)) totalVolume += v;
    });

    soldMap.fitBounds(bounds);
    if (props.length === 1) soldMap.setZoom(14);

    subEl.textContent = `${props.length} closed, ${fmtMoney(totalVolume)} volume`;
    keyBarEl.innerHTML = `
      <span><b>${props.length}</b> total sold</span>
      <span><span class="swatch" style="background:${BUYER_COLOR}"></span>Buyer side: <b>${buyerCount}</b></span>
      <span><span class="swatch" style="background:${SELLER_COLOR}"></span>Seller side: <b>${sellerCount}</b></span>
      ${otherCount > 0 ? `<span><span class="swatch" style="background:${OTHER_COLOR}"></span>Other: <b>${otherCount}</b></span>` : ''}
    `;
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state">Fetch failed: ${err.message}. Confirm <b>Sold_Properties</b> is published as CSV.</div>`;
  }
}

function focusSoldMarker(i){
  document.querySelectorAll('.sold-prop-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('sold-card-' + i);
  if (card) card.classList.add('active');
  const m = soldMarkers[i];
  if (!m) return;
  soldMap.panTo(m.getPosition());
  soldMap.setZoom(15);
  google.maps.event.trigger(m, 'click');
}

initSoldMapSetup();

refreshBtn.addEventListener('click', () => { loadData(); });
loadData();
